server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # En-têtes de sécurité du SPA (issue #12). L'API pose les siens via helmet ;
    # ils ne sont donc ajoutés que sur les locations servies par Nginx.
    #
    # CSP :
    # - script-src 'self' : aucun script inline (l'anti-flash du thème est dans
    #   /theme-init.js) ;
    # - style-src 'unsafe-inline' : styles posés à l'exécution par MapLibre et
    #   React (risque faible comparé aux scripts) ;
    # - api.maptiler.com : style, tuiles, glyphes et sprites de la carte. Un
    #   VITE_MAP_STYLE_URL / VITE_MAP_STYLE_DARK_URL sur un autre domaine doit
    #   être ajouté à connect-src et img-src ;
    # - worker-src blob: : workers MapLibre.
    # HSTS est ignoré par les navigateurs en HTTP (démo locale) et ne prend
    # effet que derrière HTTPS.
    set $csp "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://api.maptiler.com; font-src 'self' data:; connect-src 'self' https://api.maptiler.com; worker-src 'self' blob:; child-src blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'";

    # API JSON (cookies JWT/CSRF transmis tels quels).
    location /api/ {
        proxy_pass http://app:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Fichiers uploadés (avatars, galerie) : jamais interprétés comme HTML/JS.
    # L'API pose déjà nosniff et le cache immuable sur /uploads.
    location /uploads/ {
        proxy_pass http://app:4000;
        proxy_set_header Host $host;
        add_header Content-Security-Policy "default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; sandbox" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
    }

    # Pages ville pour le référencement (lot N9), plan du site et robots.txt :
    # HTML ou texte produits par l'API (données publiques), qui pose ses propres
    # en-têtes de sécurité (CSP sans script) et le cache. Le SPA n'est pas
    # concerné : ces chemins sont plus précis que `location /` ci-dessous.
    location /barbers/ville/ {
        proxy_pass http://app:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location ~ ^/(sitemap\.xml|robots\.txt)$ {
        proxy_pass http://app:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback : toute route non /api et non /uploads renvoie index.html.
    location / {
        try_files $uri /index.html;
        add_header Content-Security-Policy $csp always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }
}
