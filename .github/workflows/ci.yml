name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    name: Typecheck, lint, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

      # Audit contrôlé : informatif tant que le tri des 17 alertes (Lot 0)
      # n'est pas terminé. À rendre bloquant sur "critical" (production uniquement)
      # une fois le tri documenté.
      - name: Audit npm (production, informatif)
        run: npm audit --omit=dev --audit-level=critical
        continue-on-error: true

  e2e:
    name: E2E et accessibilité (Playwright + axe)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # Base de démo neuve (PGlite), API et client démarrés par Playwright.
      - name: E2E (parcours clavier + axe WCAG AA clair/sombre)
        run: npm run test:e2e

      - name: Rapport Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
