services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: findbarber
      POSTGRES_PASSWORD: findbarber
      POSTGRES_DB: findbarber
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U findbarber -d findbarber"]
      interval: 5s
      timeout: 5s
      retries: 12

  app:
    build:
      context: .
      target: app
    restart: unless-stopped
    environment:
      # HTTP local : NODE_ENV=development évite cookies Secure / HSTS.
      # Le pilote PostgreSQL est forcé via DB_DRIVER (découplé de NODE_ENV).
      NODE_ENV: development
      DB_DRIVER: postgres
      DATABASE_URL: postgresql://findbarber:findbarber@db:5432/findbarber
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-me-0123456789abcdef}
      CORS_ORIGIN: http://localhost:8080
      UPLOAD_DIR: /app/data/uploads
      PORT: 4000
      TRUST_PROXY_HOPS: 1
    volumes:
      - uploads:/app/data/uploads
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "4000"

  web:
    build:
      context: .
      target: web
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - app

volumes:
  pgdata:
  uploads:
