# Démo locale. Variables lues depuis l'environnement ou le fichier `.env` à la
# racine (voir la section « Docker » de `.env.example`). Aucun secret réel ici :
# JWT_SECRET est obligatoire, les identifiants PostgreSQL ont des valeurs de
# démo par défaut (base non exposée hors du réseau Docker).
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-findbarber}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-findbarber}
      POSTGRES_DB: ${POSTGRES_DB:-findbarber}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  app:
    build:
      context: .
      target: app
    restart: unless-stopped
    environment:
      # HTTP local : NODE_ENV=development évite cookies Secure / HSTS.
      # Le pilote PostgreSQL est forcé via DB_DRIVER (découplé de NODE_ENV).
      NODE_ENV: development
      DB_DRIVER: postgres
      DATABASE_URL: postgresql://${POSTGRES_USER:-findbarber}:${POSTGRES_PASSWORD:-findbarber}@db:5432/${POSTGRES_DB:-findbarber}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET manquant - le definir dans .env (voir .env.example)}
      # Origine publique du SPA (CORS + liens de vérification d'email).
      CORS_ORIGIN: ${WEB_ORIGIN:-http://localhost:8080}
      FRONTEND_URL: ${WEB_ORIGIN:-http://localhost:8080}
      UPLOAD_DIR: /app/data/uploads
      PORT: 4000
      TRUST_PROXY_HOPS: 1
      MAPTILER_GEOCODING_API_KEY: ${MAPTILER_GEOCODING_API_KEY:-}
      # Emails : `log` par défaut (affichés dans `docker compose logs app`) ;
      # renseigner MAIL_TRANSPORT=smtp + SMTP_* dans .env pour un envoi réel.
      MAIL_TRANSPORT: ${MAIL_TRANSPORT:-log}
      EMAIL_FROM: ${EMAIL_FROM:-FindBarber <no-reply@findbarber.local>}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
    volumes:
      - uploads:/app/data/uploads
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "4000"

  web:
    build:
      context: .
      target: web
      # Variables publiques de la carte (lues au build du SPA).
      args:
        VITE_MAP_API_KEY: ${VITE_MAP_API_KEY:-}
        VITE_MAP_STYLE_ID: ${VITE_MAP_STYLE_ID:-dataviz-v4}
        VITE_MAP_STYLE_URL: ${VITE_MAP_STYLE_URL:-}
        VITE_MAP_STYLE_DARK_URL: ${VITE_MAP_STYLE_DARK_URL:-}
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - app

volumes:
  pgdata:
  uploads:
